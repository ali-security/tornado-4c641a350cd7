# The "build" workflow produces wheels (and the sdist) for all python
# versions/platforms. Where possible (i.e. the build is not a cross-compile),
# the test suite is also run for the wheel (this test covers fewer
# configurations than the "test" workflow and tox.ini).
name: Build

on:
  workflow_dispatch:
    # Allow this workflow to be run manually (pushing to testpypi instead of pypi)

permissions: {}

env:
  python-version: '3.9'

jobs:
  build_sdist:
    name: Build sdist
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: ${{ env.python-version }}

      - name: Check metadata
        run: "python setup.py check"
      - name: Build sdist
        run: "python setup.py sdist && ls -l dist"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-sdist
          path: ./dist/tornado-*.tar.gz

  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, ubuntu-22.04-arm, windows-2022, macos-15]

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        name: Install Python
        with:
          python-version: ${{ env.python-version }}

      - name: Build wheels
        uses: pypa/cibuildwheel@v3.4.0
        env:
          # Sealed rebuild: resolve the isolated build backend (setuptools/wheel) from the
          # release-date PyPI snapshot so the WHEEL Generator matches the public wheel.
          CIBW_ENVIRONMENT: "PIP_INDEX_URL=https://:2026-06-08T17:34:38Z@time-machines-pypi.sealsecurity.io/"
          # Sealed rebuild: macos-15 is arm64, so x86_64 wheels are tested under Rosetta, where
          # timing-sensitive tests (httputil linear-performance, iostream SSL) are unreliable.
          # The suite still runs natively on arm64 macOS; the first two selectors are the
          # pyproject.toml test-skip values, repeated because this env var overrides them.
          CIBW_TEST_SKIP: "*-win_arm64 cp313-musllinux_i686 *-macosx_x86_64 *-macosx_universal2:x86_64"

      - name: Audit ABI3 compliance
        # This may be moved into cibuildwheel itself in the future. See
        # https://github.com/pypa/cibuildwheel/issues/1342
        run: "pip install abi3audit && abi3audit --verbose --summary ./wheelhouse/*.whl"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.os }}
          path: ./wheelhouse/*.whl

  upload_pypi_test:
    name: Upload to PyPI (test)
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    if: github.repository == 'tornadoweb/tornado' && github.event_name == 'workflow_dispatch'
    permissions:
      # This permission is required for pypi's "trusted publisher" feature
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true

  upload_pypi:
    name: Upload to PyPI (prod)
    needs: [build_wheels, build_sdist]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    if: github.repository == 'tornadoweb/tornado' && github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    permissions:
      # This permission is required for pypi's "trusted publisher" feature
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: artifacts-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
